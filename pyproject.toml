[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "permit_data_extraction"
version = "0.0.1"
description = "Extracting relevant information from air permits using LLM"
authors = [
  { name = "LBNL" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["permit_data_extraction"]
include = ["pyproject.toml", "permit_data_extraction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["permit_data_extraction"]
force-sort-within-sections = true

